aturally present on the fruit and in the environment, with no artificial additives used in the process. Their work relies on techniques characteristic of Champagne production - methods such as remuage (rotating bottles to collect sediment) and dégorgement (removing sediment after bottle fermentation) are applied. For aging, they use oak wine barrels, while part of the process is carried out on authentic French pupitres from the 1960s. This approach gives their ciders a distinctive finesse, purity, and depth of flavor. Their philosophy is rooted in minimal intervention and maximum respect for natural processes. As a result, each cider becomes a unique expression of the harvest year, the apples, and the soil from which it originates.","UrlLink":"cidre-rhino","ProductMakerUrlLink":null,"Image":{"Image":"/images/productmakers/48f22cbf9afc4578990d26f837836c14.png","Source":null,"SourceUrl":null},"Score":{"Score":9.360897196261682,"DividedScore":4.7,"ScoreCount":0,"ValidScoreCount":206},"ProductName":null,"ProductMakerName":null,"Award":{"EntityId":45601,"EntityType":0,"Logo":null,"Name":"Bronze"},"RelatedItem":{"EntityId":183,"EntityType":9,"Name":"Cider","Plural":"Ciders","UrlLink":"Ciders"},"Region":{"RegionLevel":5,"RegionName":"Leningrad Oblast","RegionAdjective":null,"RegionUrlLink":"leningrad-oblast","RegionEmblemImage":"/images/emblems/5ebc3f1ff28347708b9a5cffccb8d540.png","RegionMaterializedPath":"/3/18016/158/15039/3460/","CountryRegionLevel":7,"CountryName":"Russia","CountryAdjective":"Russian","CountryEmblemImage":"/Images/Emblems/12553e8297fa45d29593e98b5cb1c12c.png","CountryUrlLink":"russia","DisplayText":"Leningrad Oblast, Russia","DisplayUrlLink":"russia","DisplayEmblemImage":"/Images/Emblems/12553e8297fa45d29593e98b5cb1c12c.png"},"Location":{"Lat":60.0793208,"Long":31.8926645,"Distance":null,"DistanceMiles":null},"Address":null,"BestProducts":[{"ProductMakerId":17171,"Name":"Alice and Wonderpear","UrlLink":"cidre-rhino-alice-and-wonderpear","Image":{"Imag     <script>

    var didScroll;
    // on scroll, let the interval function know the user has scrolled
    $(window).scroll(function (event) {
        didScroll = true;
    });
    $(window).load(function () {
        hasScrolled();
    })
    // run hasScrolled() and reset didScroll status
    setInterval(function () {
        if (didScroll) {
            hasScrolled();
            didScroll = false;
        }
    }, 250);

    var lastScrollTop = 0;
    var delta = 0;

    function hasScrolled() {
        var headerElem = $('#header-id');
        var stickyRangeSliderElem = $('.near-me-sticky__range-slider-wrapper');
        var regionFloatingFilter = $('.search-results__floating-filter');//floating filter on regions
        var submenuFloatingFilter = $('.header-bottom__submenu'); // open menu on floating filter on regions
        var hamburgerOpen = document.querySelector('.offcanvas--active');
        var navbarHeight = headerElem.outerHeight();
        var st = $(this).scrollTop();

        if (Math.abs(lastScrollTop - st) <= delta)
            return;
        
        // If current position > last position AND scrolled past navbar... // Scroll Down
        if (st > lastScrollTop && st > navbarHeight && hamburgerOpen == null ) {
            headerElem.css('top', '-145px'); // If we height login popup will not be displayed
            stickyRangeSliderElem.css('top', '0px')
            regionFloatingFilter.css('top', '');
            submenuFloatingFilter.css('top', '0px');
            
        }
        else { //scrolling up
            if (st + $(window).height() < $(document).height()) {
                headerElem.css('top', 0);
                stickyRangeSliderElem.css('top', navbarHeight + 'px')
                regionFloatingFilter.css('top', navbarHeight + 'px');
                submenuFloatingFilter.css('top', '');
            }
        }

        lastScrollTop = st;
    }

</script>
