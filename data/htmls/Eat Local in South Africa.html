go Olive Estate is a family-owned olive estate established in 2010, located in the Scherpenheuwel Valley along the Breede River in the Western Cape region of South Africa. Owners Nick and Brenda Wilkinson run the estate with a vision to combine expertise, innovation, and sustainability, with Nick holding a master’s qualification in olive growing and experience gained under Giorgio Mori and at UC Davis University. The estate is home to around 18,000 olive trees planted on sandy-loam soils, where the Klein Karoo climate provides ideal conditions for producing fruity and complex oils. Cultivated varieties include Frantoio, Leccino, Coratina, and FS17, with olives harvested by hand and cold-pressed immediately to preserve freshness and nutritional value. The resulting oils are characterized by aromas of green vegetables, peas, and fresh leafy greens, enriched with nutty tones and a pleasant peppery finish. Rio Largo has gained particular recognition through its innovative bag-in-decanter packaging, which ensures the oil stays fresh to the very last drop without exposure to oxygen. Their production philosophy emphasizes sustainable practices and careful resource management, highlighting a deep connection to nature and the terroir. The Rio Largo brand is equally present in the domestic market and international culinary circles, where it is highly valued by top restaurants and professional chefs. The estate also offers tours and tastings, making it a destination for gourmets and lovers of authentic experiences. By blending tradition, modern technology, and innovation, Rio Largo has become a synonym for quality, authenticity, and a modern interpretation of South African olive growing.","UrlLink":"rio-largo-olive-estate","ProductMakerUrlLink":null,"Image":{"Image":"/images/productmakers/256a6fb3e9fa4a65b02bbae0b83c4b9f.png","Source":null,"SourceUrl":null},"Score":{"Score":9.636000000000001,"DividedScore":4.8,"ScoreCount":0,"ValidScoreCount":168},"ProductName":null,"ProductMa     <script>

    var didScroll;
    // on scroll, let the interval function know the user has scrolled
    $(window).scroll(function (event) {
        didScroll = true;
    });
    $(window).load(function () {
        hasScrolled();
    })
    // run hasScrolled() and reset didScroll status
    setInterval(function () {
        if (didScroll) {
            hasScrolled();
            didScroll = false;
        }
    }, 250);

    var lastScrollTop = 0;
    var delta = 0;

    function hasScrolled() {
        var headerElem = $('#header-id');
        var stickyRangeSliderElem = $('.near-me-sticky__range-slider-wrapper');
        var regionFloatingFilter = $('.search-results__floating-filter');//floating filter on regions
        var submenuFloatingFilter = $('.header-bottom__submenu'); // open menu on floating filter on regions
        var hamburgerOpen = document.querySelector('.offcanvas--active');
        var navbarHeight = headerElem.outerHeight();
        var st = $(this).scrollTop();

        if (Math.abs(lastScrollTop - st) <= delta)
            return;
        
        // If current position > last position AND scrolled past navbar... // Scroll Down
        if (st > lastScrollTop && st > navbarHeight && hamburgerOpen == null ) {
            headerElem.css('top', '-145px'); // If we height login popup will not be displayed
            stickyRangeSliderElem.css('top', '0px')
            regionFloatingFilter.css('top', '');
            submenuFloatingFilter.css('top', '0px');
            
        }
        else { //scrolling up
            if (st + $(window).height() < $(document).height()) {
                headerElem.css('top', 0);
                stickyRangeSliderElem.css('top', navbarHeight + 'px')
                regionFloatingFilter.css('top', navbarHeight + 'px');
                submenuFloatingFilter.css('top', '');
            }
        }

        lastScrollTop = st;
    }

</script>
