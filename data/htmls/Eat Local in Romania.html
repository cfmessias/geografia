    <script>

    var didScroll;
    // on scroll, let the interval function know the user has scrolled
    $(window).scroll(function (event) {
        didScroll = true;
    });
    $(window).load(function () {
        hasScrolled();
    })
    // run hasScrolled() and reset didScroll status
    setInterval(function () {
        if (didScroll) {
            hasScrolled();
            didScroll = false;
        }
    }, 250);

    var lastScrollTop = 0;
    var delta = 0;

    function hasScrolled() {
        var headerElem = $('#header-id');
        var stickyRangeSliderElem = $('.near-me-sticky__range-slider-wrapper');
        var regionFloatingFilter = $('.search-results__floating-filter');//floating filter on regions
        var submenuFloatingFilter = $('.header-bottom__submenu'); // open menu on floating filter on regions
        var hamburgerOpen = document.querySelector('.offcanvas--active');
        var navbarHeight = headerElem.outerHeight();
        var st = $(this).scrollTop();

        if (Math.abs(lastScrollTop - st) <= delta)
            return;
        
        // If current position > last position AND scrolled past navbar... // Scroll Down
        if (st > lastScrollTop && st > navbarHeight && hamburgerOpen == null ) {
            headerElem.css('top', '-145px'); // If we height login popup will not be displayed
            stickyRangeSliderElem.css('top', '0px')
            regionFloatingFilter.css('top', '');
            submenuFloatingFilter.css('top', '0px');
            
        }
        else { //scrolling up
            if (st + $(window).height() < $(document).height()) {
                headerElem.css('top', 0);
                stickyRangeSliderElem.css('top', navbarHeight + 'px')
                regionFloatingFilter.css('top', navbarHeight + 'px');
                submenuFloatingFilter.css('top', '');
            }
        }

        lastScrollTop = st;
    }

</script>
