 Golan Heights, the distillery uses local barley and wheat, along with pure spring water from the plateau, to capture the authenticity of the terroir in its products. Its portfolio includes a wide range of spirits - from whisky and gin to arak and absinthe, as well as brandy, fruit eaux-de-vie, and grappa. In the production process, it combines traditional distillation techniques with innovation, while emphasizing a philosophy of sustainability and local identity. The distillery also offers guided tours, tastings, and the opportunity to personalize bottles, further connecting consumers with the brand’s story.","UrlLink":"the-golan-heights-distillery","ProductMakerUrlLink":null,"Image":{"Image":"/images/productmakers/6b822f8b91554db0823650fea1359c4c.png","Source":null,"SourceUrl":null},"Score":{"Score":10.0,"DividedScore":5.0,"ScoreCount":0,"ValidScoreCount":64},"ProductName":null,"ProductMakerName":null,"Award":{"EntityId":28366,"EntityType":0,"Logo":"/images/productawards/fbf82fe394dd484b8819b601877dd27b.png","Name":"Spirit Gold Outstanding"},"RelatedItem":{"EntityId":215,"EntityType":9,"Name":"Spirit","Plural":"Spirits","UrlLink":"Spirits"},"Region":{"RegionLevel":1,"RegionName":"Qatsrin","RegionAdjective":"","RegionUrlLink":"qatsrin","RegionEmblemImage":null,"RegionMaterializedPath":"/1/93/1962/25958/","CountryRegionLevel":7,"CountryName":"Israel","CountryAdjective":"Israeli","CountryEmblemImage":"/images/emblems/c670292446bf44929e2248661c338bd1.png","CountryUrlLink":"israel","DisplayText":"Qatsrin, Israel","DisplayUrlLink":"israel","DisplayEmblemImage":"/images/emblems/c670292446bf44929e2248661c338bd1.png"},"Location":{"Lat":32.9936825,"Long":35.7110236,"Distance":null,"DistanceMiles":null},"Address":"18 St, Qatsrin, Golan Heights, Israel","BestProducts":[{"ProductMakerId":8545,"Name":"Holy Spirit Absinthe","UrlLink":"the-golan-heights-distillery-holy-spirit-absinthe","Image":{"Image":"/images/products/dd7a4ea504084f23aa83a92379d00ac4.png","Source":null,"SourceU     <script>

    var didScroll;
    // on scroll, let the interval function know the user has scrolled
    $(window).scroll(function (event) {
        didScroll = true;
    });
    $(window).load(function () {
        hasScrolled();
    })
    // run hasScrolled() and reset didScroll status
    setInterval(function () {
        if (didScroll) {
            hasScrolled();
            didScroll = false;
        }
    }, 250);

    var lastScrollTop = 0;
    var delta = 0;

    function hasScrolled() {
        var headerElem = $('#header-id');
        var stickyRangeSliderElem = $('.near-me-sticky__range-slider-wrapper');
        var regionFloatingFilter = $('.search-results__floating-filter');//floating filter on regions
        var submenuFloatingFilter = $('.header-bottom__submenu'); // open menu on floating filter on regions
        var hamburgerOpen = document.querySelector('.offcanvas--active');
        var navbarHeight = headerElem.outerHeight();
        var st = $(this).scrollTop();

        if (Math.abs(lastScrollTop - st) <= delta)
            return;
        
        // If current position > last position AND scrolled past navbar... // Scroll Down
        if (st > lastScrollTop && st > navbarHeight && hamburgerOpen == null ) {
            headerElem.css('top', '-145px'); // If we height login popup will not be displayed
            stickyRangeSliderElem.css('top', '0px')
            regionFloatingFilter.css('top', '');
            submenuFloatingFilter.css('top', '0px');
            
        }
        else { //scrolling up
            if (st + $(window).height() < $(document).height()) {
                headerElem.css('top', 0);
                stickyRangeSliderElem.css('top', navbarHeight + 'px')
                regionFloatingFilter.css('top', navbarHeight + 'px');
                submenuFloatingFilter.css('top', '');
            }
        }

        lastScrollTop = st;
    }

</script>
