    <script>
        window.ta.productsProductMakers = [{"EntityId":11203,"EntityType":20,"Name":"Champagne Krug","Description":"Champagne Krug is one of the most prestigious and revered Champagne houses, renowned for its unwavering commitment to excellence and the artistry of champagne-making. Founded in 1843 by Johann Joseph Krug, this family-run house has always adhered to a philosophy of uncompromising quality, emphasizing the individuality of each vintage and terroir. Krug stands apart with its unique approach—each bottle of champagne is crafted from meticulously selected wines from different years and vineyards, creating unparalleled depth, complexity, and richness.\r\n\r\nTheir most iconic champagne, Krug Grande Cuvée, embodies this philosophy, blending up to 200 wines from over 10 different vintages to achieve perfect harmony and sophistication in every edition. Additionally, Krug is renowned for its exclusive vintage champagnes, Krug Rosé, and rare single-vineyard expressions like Clos du Mesnil and Clos d'Ambonnay, which originate from exceptional, limited-production plots. Each bottle undergoes an extended aging process in Krug’s cellars, allowing the champagnes to develop profound aromas, refined textures, and remarkable elegance.\r\n\r\nWith an uncompromising dedication to quality, a deep respect for tradition, and an innovative spirit, Krug remains synonymous with luxury, refinement, and the ultimate champagne experience.","UrlLink":"champagne-krug","ProductMakerUrlLink":null,"Image":{"Image":"/images/productmakers/9cc1e9a93bbb44a1bcc00a417b891b68.png","Source":null,"SourceUrl":null},"Score":{"Score":10.0,"DividedScore":5.0,"ScoreCount":0,"ValidScoreCount":636},"ProductName":null,"ProductMakerName":null,"Award":{"EntityId":33825,"EntityType":0,"Logo":"/images/productawards/0b6cb14b36d54e30849fc570ac57b5f4.png","Name":"4.7"},"RelatedItem":{"EntityId":165,"EntityType":9,"Name":"Wine","Plural":"Wines","UrlLink":"Wine"},"Region":{"RegionLevel":1,"RegionName":"Reims","R     <script>

    var didScroll;
    // on scroll, let the interval function know the user has scrolled
    $(window).scroll(function (event) {
        didScroll = true;
    });
    $(window).load(function () {
        hasScrolled();
    })
    // run hasScrolled() and reset didScroll status
    setInterval(function () {
        if (didScroll) {
            hasScrolled();
            didScroll = false;
        }
    }, 250);

    var lastScrollTop = 0;
    var delta = 0;

    function hasScrolled() {
        var headerElem = $('#header-id');
        var stickyRangeSliderElem = $('.near-me-sticky__range-slider-wrapper');
        var regionFloatingFilter = $('.search-results__floating-filter');//floating filter on regions
        var submenuFloatingFilter = $('.header-bottom__submenu'); // open menu on floating filter on regions
        var hamburgerOpen = document.querySelector('.offcanvas--active');
        var navbarHeight = headerElem.outerHeight();
        var st = $(this).scrollTop();

        if (Math.abs(lastScrollTop - st) <= delta)
            return;
        
        // If current position > last position AND scrolled past navbar... // Scroll Down
        if (st > lastScrollTop && st > navbarHeight && hamburgerOpen == null ) {
            headerElem.css('top', '-145px'); // If we height login popup will not be displayed
            stickyRangeSliderElem.css('top', '0px')
            regionFloatingFilter.css('top', '');
            submenuFloatingFilter.css('top', '0px');
            
        }
        else { //scrolling up
            if (st + $(window).height() < $(document).height()) {
                headerElem.css('top', 0);
                stickyRangeSliderElem.css('top', navbarHeight + 'px')
                regionFloatingFilter.css('top', navbarHeight + 'px');
                submenuFloatingFilter.css('top', '');
            }
        }

        lastScrollTop = st;
    }

</script>
